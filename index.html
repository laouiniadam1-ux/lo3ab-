          for (var i = 0; i < total; i++) h += '<button type="button" class="gcell" data-cell="' + i + '" aria-label="خانة ' + (i + 1) + '"' + (st.phase === 'input' ? '' : ' disabled') + '></button>';
          host.innerHTML = '<div class="round-bar"><span class="round-chip">' + (kind === 'flash' ? 'الخانات: ' : 'طول المسار: ') + st.target.length + '</span>' + roundPlayer(p) + '</div>' +
            '<div class="game-hint" id="gridMsg" role="status">' + (st.phase === 'idle' ? 'اضغط «ابدأ» وركّز فالخانات' : 'ركّز…') + '</div>' + h + '</div>' +
            '<div class="challenge-actions" id="gridActions">' + (st.phase === 'idle' ? '<button class="btn btn-sun" id="gridGo" data-tv-start type="button">ابدأ</button>' : '') + '</div>';
          $$('[data-cell]', host).forEach(function (b) { b.onclick = function () { tap(Number(b.dataset.cell)); }; });
          var go = $('#gridGo', host); if (go) go.onclick = start;
        }

      };

      /* ---------- D) "what disappeared?" memory (emoji / words / numbers) ---------- */
      ENG.gen_missing = function (host) {
        host.classList.add('challenge-stage');
        var kind = S.game.cfg.kind, d = diffNow(), N = lerpI(4, 12, d), alive = true, timers = [];
        var pools = { emoji:EMOJI_POOL, words:LETWORDS.filter(function (w) { return w.length <= 7; }), numbers:range(10, 99).map(String) };
        var st = { turn:0, phase:'idle', items:[], missing:'', remain:[], opts:[], answer:null }; host.__st = st;
        function clearT() { timers.forEach(clearTimeout); timers = []; }
        onGone(host, function () { alive = false; clearT(); });
        function newRound() {
          var pool = pools[kind]; st.items = shuffle(pool).slice(0, N); st.missing = pick(st.items);
          st.remain = st.items.filter(function (x) { return x !== st.missing; });
          var unseen = pool.filter(function (x) { return st.items.indexOf(x) < 0; });
          var o = [st.missing].concat(shuffle(st.remain).slice(0, 2), shuffle(unseen).slice(0, 1));
          while (o.length < 4) { var x = pick(unseen); if (o.indexOf(x) < 0) o.push(x); }
          st.opts = shuffle(o); st.answer = null;
        }
        function cloud(list) { return '<div class="item-cloud" dir="auto">' + list.map(function (x) { return '<span>' + esc(x) + '</span>'; }).join('') + '</div>'; }
        function show() {
          clearT(); newRound(); st.phase = 'show'; draw();
          timers.push(setTimeout(function () { if (!alive) return; st.phase = 'ask'; draw(); focusIn(host, '[data-o]'); }, Math.max(1800, N * lerpI(900, 420, d))));
        }
        function draw() {
          var p = curPlayer(st.turn), done = st.answer !== null, ok = done && st.answer === st.missing;
          host.innerHTML = '<div class="round-bar"><span class="round-chip">العناصر: ' + N + '</span>' + roundPlayer(p) + '</div>' +
            (st.phase === 'idle' ? '<div class="spotlight"><span class="spotlight-label">ذاكرة</span><h3 class="spotlight-question">حفظ العناصر، ومن بعد قول شنو غاب!</h3></div><div class="challenge-actions"><button class="btn btn-sun" id="msGo" data-tv-start type="button">ابدأ</button></div>' :
            st.phase === 'show' ? '<div class="spotlight"><span class="spotlight-label">حفظ!</span>' + cloud(st.items) + '</div>' :
            '<div class="spotlight"><span class="spotlight-label">شنو اللي غاب؟</span>' + cloud(st.remain) + '</div>' +
            '<div class="eg-grid c2">' + st.opts.map(function (o, i) {

          else if (!$('#nameKeypad').hidden) toggleNameKeys(false);
          else { setTV(false, true); focusControl($('#tvBtn'), false); }
          return;
        }
        if (key === 'Tab') {
          keyboardNav = true;
          if (!S.game) return;
          var list = controls(viewRoot());
          var idx = list.indexOf(here);
          if (idx < 0 || (!e.shiftKey && idx === list.length-1) || (e.shiftKey && idx === 0)) {
            e.preventDefault(); focusControl(list[e.shiftKey ? list.length-1 : 0]);
          }
          return;
        }
        if (key && key.indexOf('Arrow') === 0 && !e.altKey && !e.metaKey && !e.ctrlKey) {
          if (typing && (here.tagName !== 'INPUT' || key === 'ArrowLeft' || key === 'ArrowRight' || !S.tv)) return;
          keyboardNav = true; e.preventDefault(); moveControl(key); return;
        }
        if (key === 'Enter' || key === 'OK' || key === 'Accept' || key === 'Select' || code === 13) {
          keyboardNav = true;
          if (typing) return;
          var root = viewRoot();
          if (!root) return;
          e.preventDefault();
          if (e.repeat) return;
          if (!root.contains(here) || !usable(here)) focusControl(S.game ? arenaPrimary() : $('#browseGames'));
          else { recentControl = controlToken(here); here.click(); }
        }
      }
      function setupNavigation() {
        document.addEventListener('focusin', function (e) {
          var t = controlToken(e.target);
          if (t) { recentControl = t; markControl(e.target); }
        });
        function pointer() { keyboardNav = false; markControl(null); }
        document.addEventListener('pointerdown', pointer);
        document.addEventListener('mousedown', pointer);
        document.addEventListener('keydown', navigateKey);
        if ('MutationObserver' in window) {
          var observer = new MutationObserver(function () {
            if (!keyboardNav) return;
            var area = viewRoot(), active = document.activeElement;
            if (!area || (area.contains(active) && usable(active))) return;
            var sameScreen = recentControl && recentControl.game === (S.game && S.game.id);
            var replacement = sameScreen ? findControl(recentControl, area) : null;
            if (!replacement && !S.game && recentControl) {
              if (recentControl.data.some(function (a) { return a[0] === 'data-qn' || a[0] === 'data-del'; })) replacement = $('#guestBtn') || $('#nameInput');
              else if (recentControl.id === 'clearFilters') replacement = $('#catPills [data-cat="all"]');
            }
            focusControl(replacement || (S.game ? arenaPrimary() : $('#browseGames')));
          });
          observer.observe($('#root'), { childList:true, subtree:true });
        }
      }
      function fullElement() { return document.fullscreenElement || document.webkitFullscreenElement || document.webkitCurrentFullScreenElement; }
      function reflectFullscreen() { $('#fullscreenLabel').textContent = fullElement() ? 'تصغير الشاشة' : 'ملء الشاشة'; }
      function screenMessage(text) { $('#screenNotice').textContent = text; $('.remote-info p').textContent = text; }
      function fullscreen(on) {
        var target = on ? document.documentElement : document;
        var fn = on ? target.requestFullscreen || target.webkitRequestFullscreen || target.webkitRequestFullScreen : document.exitFullscreen || document.webkitExitFullscreen || document.webkitCancelFullScreen;
        if (on && fullElement() || !on && !fullElement()) return;
        if (!fn) { if (on) screenMessage('وضع التلفاز خدام بلا ملء الشاشة.'); return; }
        try {
          var result = fn.call(target);
          if (result && result.catch) result.catch(function () { if (on && S.tv) screenMessage('وضع التلفاز خدام بلا ملء الشاشة.'); });
        } catch (e) { if (on && S.tv) screenMessage('وضع التلفاز خدام بلا ملء الشاشة.'); }
      }
      function setTV(on, fromUser) {
        S.tv = on;
        S.screenOnly = on;
        document.documentElement.classList.toggle('tv-on', on);
        document.body.classList.toggle('tv-mode', on);
        $('#tvBtn').setAttribute('aria-pressed', String(on));
        $('#tvButtonLabel').textContent = on ? 'خروج من التلفاز' : 'وضع التلفاز';
        $('#tvStatus').textContent = on ? 'وضع التلفاز خدام' : 'جاهزة للتلفاز';
        $('.remote-info p').textContent = on ? 'بالأسهم تحرّك، وبـ OK اختار.' : 'تنقّل بالريموت أو بالكيبورد.';
        $('#screenNotice').textContent = '';
        $('#fullscreenBtn').hidden = !on;
        $('#nameKeysBtn').hidden = !on;
        if (!on && !$('#nameKeypad').hidden) toggleNameKeys(false, false);
        if (on) {
          S.cat = 'all'; S.query = ''; S.playableOnly = false; $('#searchInput').value = '';
          renderPills();
        }
        renderGrid(); reflectFullscreen();
        if (fromUser) { saveSetting('tv', on ? '1' : '0'); fullscreen(on); }
      }
      function toggleNameKeys(open, focus) {
        var panel = $('#nameKeypad');
        panel.hidden = !open;
        $('#nameKeysBtn').setAttribute('aria-expanded', String(open));
        if (focus !== false) focusControl(open ? $('button',panel) : $('#nameKeysBtn'), false);
      }
      function setupNameKeys() {
        var panel = $('#nameKeypad'), input = $('#nameInput');
        var letters = 'أبتثجحخدذرزسشصضطظعغفقكلمنهويءإآؤئةى';
        panel.innerHTML = letters.split('').map(function (l) { return '<button type="button" data-letter="' + l + '">' + l + '</button>'; }).join('') +
          '<button type="button" class="wide" id="nameSpace">مسافة</button><button type="button" class="wide" id="nameDelete">مسح حرف</button><button type="button" class="wide" id="nameAccept">✓ زيد اللاعب</button>';
        $$('[data-letter]',panel).forEach(function (key) { key.onclick = function () { input.value = (input.value + key.dataset.letter).slice(0,22); sTick(); }; });
        $('#nameSpace').onclick = function () { input.value = (input.value + ' ').slice(0,22); };
        $('#nameDelete').onclick = function () { input.value = input.value.slice(0,-1); };
        $('#nameAccept').onclick = function () { if (addPlayer(input.value)) { input.value = ''; toggleNameKeys(false); } };
        $('#nameKeysBtn').onclick = function () { toggleNameKeys(panel.hidden); };
      }
      function gotoSection(section) {
        $$('.main-nav [data-section]').forEach(function (a) { if (a.dataset.section === section) a.setAttribute('aria-current','location'); else a.removeAttribute('aria-current'); });
        if (section === 'top') window.scrollTo(0,0);
        else $('#' + section).scrollIntoView();
        if (keyboardNav) {
          var target = section === 'games' ? $('.tile') || $('#searchInput') : section === 'roster' ? (S.tv ? $('#nameKeysBtn') : $('#nameInput')) : $('#browseGames');
          focusControl(target, false);
        }
      }
      function randomGame() {
        var pool = GAMES.filter(function (g) { return (!S.tv && !S.screenOnly || goodForTV(g)) && S.players.length >= g.min; });
        if (!pool.length) pool = GAMES.filter(function (g) { return !S.tv && !S.screenOnly || goodForTV(g); });
        sPop(); openArena(pick(pool), $('#randomBtn'));
      }
      function soundButton() {
        var b = $('#soundBtn');
        b.innerHTML = icon(S.muted ? 'muted' : 'sound');
        b.title = S.muted ? 'تشغيل الصوت' : 'كتم الصوت';
        b.setAttribute('aria-label', b.title);
        b.setAttribute('aria-pressed', String(S.muted));
      }
      function boot() {
        setupEffects();
        window.addEventListener('resize', sizeFx);
        $$('[data-game-count]').forEach(function (el) { el.textContent = GAMES.length; });
        $$('[data-riddle-count]').forEach(function (el) { el.textContent = RIDDLES.length; });
        var cg = $('#campaignGames'), ct = $('#campaignTotal');
        if (cg) cg.textContent = GAMES.length;
        if (ct) ct.textContent = GAMES.length * TOTAL_LEVELS;
        renderRoster(); renderPills(); setupNameKeys(); setupNavigation();
        renderChallenges();
        var hardBtn = $('#hardModeBtn'); if (hardBtn) hardBtn.onclick = toggleHardMode;
        var stored = readSetting('tv');
        var tvBrowser = /Smart[ -]?TV|Tizen|Web[0O]S.*TV|HbbTV|BRAVIA/i.test(navigator.userAgent);
        setTV(/(?:^|[?&])tv=1(?:&|$)/.test(location.search) || stored === '1' || (stored === null && tvBrowser), false);
        soundButton();
        $('#addForm').onsubmit = function (e) {
          e.preventDefault(); var input = $('#nameInput');
          if (addPlayer(input.value)) { input.value = ''; if (!S.tv) input.focus(); }
        };
        $('#luckyBtn').onclick = showLucky;
        $('#shuffleBtn').onclick = function () { S.players = shuffle(S.players); savePlayers(); renderRoster(); sPop(); };
        $('#resetBtn').onclick = function () { S.players = S.players.map(function (p) { return Object.assign({}, p, {score:0}); }); savePlayers(); renderRoster(); sTick(480); };
        $('#searchInput').addEventListener('input', function (e) { S.query = e.target.value; renderGrid(); });
        $('#playableToggle').onclick = function () { S.playableOnly = !S.playableOnly; sTick(680); renderGrid(); };
        $('#screenFilter').onclick = function () { S.screenOnly = !S.screenOnly; sTick(680); renderGrid(); };
        $('#randomBtn').onclick = randomGame;
        $('#tvBtn').onclick = function () { setTV(!S.tv, true); sPop(); };
        $('#fullscreenBtn').onclick = function () { fullscreen(!fullElement()); };
        document.addEventListener('fullscreenchange', reflectFullscreen);
        document.addEventListener('webkitfullscreenchange', reflectFullscreen);
        $('#soundBtn').onclick = function () { S.muted = !S.muted; saveSetting('muted', S.muted ? '1' : '0'); soundButton(); if (!S.muted) sPop(); };
        $$('#pageShell a[href^="#"]').forEach(function (a) {
          if (a.classList.contains('tile')) return;
          a.onclick = function (e) { e.preventDefault(); gotoSection(a.getAttribute('href').slice(1)); };
        });
        if (location.hash === '#games' || location.hash === '#roster') gotoSection(location.hash.slice(1));
      }

      // One document: the React entry and direct-file fallback mount the same layout and logic.
      window.mountLamma = function (container) {
        if (!container || $('#pageShell')) return;
        container.appendChild($('#lamma-screen').content.cloneNode(true));
        boot();
      };
      function mountStandalone() { window.mountLamma($('#root')); }
      if (location.protocol === 'file:' || !('noModule' in document.createElement('script'))) mountStandalone();
      else window.setTimeout(function () { if (!$('#pageShell')) mountStandalone(); }, 900);
    </script>
    <script type="module">
      if (location.protocol !== 'file:' && !document.getElementById('pageShell')) {
        import('./src/main.tsx').catch(function () { window.mountLamma(document.getElementById('root')); });
      }
    </script>
  </body>
</html>
