      function renderModal() {
        var g = S.game, c = CATS[g.cat];
        $('#modalRoot').innerHTML =
          '<div class="modal-wrap" id="modalWrap">' +
            '<div class="modal level-modal' + (g.id === 'riddles' || g.id === 'reversed-sound' || g.id === 'sound-riddles' ? ' round-screen' : '') + '" role="dialog" aria-modal="true" aria-labelledby="gameTitle">' +
              '<div class="modal-head" style="border-bottom-color:' + c.color + '">' +
                '<div class="mh-l"><span class="mh-em" aria-hidden="true">' + g.em + '</span>' +
                  '<span style="min-width:0"><h2 id="gameTitle">' + esc(g.title) + '</h2><span class="mh-sub">' + esc(g.sub) + '</span></span>' +
                '</div>' +
                '<div class="mh-tools">' +
                  '<button type="button" class="mh-btn" id="btnLevels" aria-controls="levelLayer">150 مستوى</button>' +
                  '<button type="button" class="mh-btn" id="btnScores" aria-expanded="false" aria-controls="stripArea">النقاط</button>' +
                  '<button type="button" class="mh-btn" id="btnRules" aria-expanded="false" aria-controls="stripArea">طريقة اللعب</button>' +
                  '<button type="button" class="mh-btn x" id="btnClose" aria-label="رجوع للألعاب">✕ <span class="back-text">رجوع</span></button>' +
                '</div>' +
              '</div>' +
              renderLevelBarHTML() +
              '<div id="stripArea"></div>' +
              '<div class="modal-body" id="modalBody"></div>' +
            '</div>' +
          '</div>';
        $('#btnClose').onclick = closeArena;
        $('#btnRules').onclick = function () { S.showRules = !S.showRules; renderStrip(); };
        $('#btnScores').onclick = function () { S.showScores = !S.showScores; renderStrip(); };
        $('#btnLevels').onclick = openLevelSheet;
        $('#modalWrap').addEventListener('mousedown', function (e) { if (!S.tv && e.target.id === 'modalWrap') closeArena(); });
        bindLevelBar(); renderStrip(); renderModalBody();
      }

      function renderStrip() {
        var g = S.game, area = $('#stripArea');
        if (!g || !area) return;
        [['#btnScores',S.showScores],['#btnRules',S.showRules]].forEach(function (pair) {
          var button = $(pair[0]); button.classList.toggle('on', pair[1]); button.setAttribute('aria-expanded', String(pair[1]));
        });
        var html = '';
        if (S.showScores) {
          var sorted = S.players.slice().sort(function (a, b) { return b.score - a.score; });
          html += '<div class="strip scores"><span class="lbl">🏆 ترتيب النقاط:</span>' +
            (sorted.length ? sorted.map(function (p) {
              return '<span class="sc-chip">' + p.av + ' ' + esc(p.name) + ': <b>' + p.score + '</b></span>';
            }).join('') : '<span class="lbl">لا يوجد لاعبون</span>') + '</div>';
        }
        if (S.showRules) {
          html += '<div class="strip rules" style="display:block">' +
            '<span class="lbl">📖 طريقة اللعب باختصار</span>' +
            '<ul class="rules-list" style="margin-top:6px">' + g.rules.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ul></div>';
        }
        area.innerHTML = html;
      }

      function renderModalBody() {
        var g = S.game, body = $('#modalBody');
        if (!g || !body) return;
        if (S.tv && !goodForTV(g)) {
          body.innerHTML = '<div class="eg-hero phone-note"><span class="round-chip">بطاقات خاصة</span><h3>هاد اللعبة أحسن فالتيليفون</h3>' +
            '<p>هنا كاينين بطاقات خاصّها تبقى سرّية. إلا كنتو مشاركين الشاشة، حبسو العرض قبل ما تكشفو البطاقات.</p>' +
            '<div class="challenge-actions"><button class="btn btn-dark" id="safeGame" data-tv-start>جرّب الألغاز فالتلفاز</button><button class="btn btn-soft" id="phonePlay">حبست العرض، كمّل اللعب</button></div></div>';
          $('#safeGame').onclick = function () { openArena(gameById('riddles')); };
          $('#phonePlay').onclick = function () { setTV(false, true); renderModalBody(); focusControl(arenaPrimary()); };
          return;
        }
        var need = Math.max(0, g.min - S.players.length);
        if (need > 0) {
          body.innerHTML = '<div class="need"><div class="em">👥</div>' +
            '<h3>هاد اللعبة خاصها ' + g.min + ' لاعبين على الأقل</h3>' +
            '<p>كاين دابا ' + S.players.length + ' فاللائحة. زيد ' + need + ' باش تبدا.</p>' +
            '<form class="add-row" id="needForm"><input class="field" id="needInput" aria-label="سمية اللاعب" placeholder="سمية لاعب إضافي…" maxlength="22" />' +
            '<button class="btn btn-dark" type="submit">+ زيد السمية</button></form>' +
            '<div class="challenge-actions" style="margin-top:13px"><button class="btn btn-soft" id="needGuest" data-tv-start>+ زيد ضيف بلا كتابة</button></div></div>';
          $('#needForm').onsubmit = function (e) {
            e.preventDefault();
            if (!addPlayer($('#needInput').value)) return;
            var after = $('#needInput'); focusControl(after || arenaPrimary(), false);
          };
          $('#needGuest').onclick = function () { addPlayer(guestName()); focusControl($('#needGuest') || arenaPrimary()); };
          return;
        }
        body.innerHTML = '<div class="eg-space" id="eg"></div>';
        mountEngine(g.engine, $('#eg'));
      }

      /* ==================== ENGINE DISPATCH ==================== */
      var ENG = {};
      function mountEngine(name, host) {
        var fn = ENG[name];
        if (fn) fn(host);
        else host.innerHTML = '<div class="eg-panel eg-center">🚧 هاد اللعبة غادي تزيد قريباً!</div>';
      }
      function needMore(host) {
        host.innerHTML = '<div class="eg-panel eg-center"><p>زيد اللاعبين أولاً.</p></div>';
      }

      /* ==================== 1) MAFIA ==================== */
      ENG.mafia = function (host) {
        var P = S.players.slice();
        var ROLES = {
          mafia:     { t:'عصابة المافيا', em:'🕶️', bg:'linear-gradient(160deg,#c4442a,#8e2c5c)', d:'مهمتك التخلص من المواطنين في الليل والتظاهر بالبراءة في النهار!' },
          doctor:    { t:'الطبيب المنقذ', em:'🩺', bg:'linear-gradient(160deg,#16a085,#0e7566)', d:'في كل ليلة تختار لاعباً واحداً لحمايته من هجوم المافيا.' },
          detective: { t:'المحقق الذكي', em:'🔍', bg:'linear-gradient(160deg,#3f6fd8,#1b3f9e)', d:'في كل ليلة تفحص هوية لاعب واحد لتعرف هل هو مافيا أم بريء.' },
          citizen:   { t:'مواطن صالح', em:'🏡', bg:'linear-gradient(160deg,#d99b1c,#a9720a)', d:'راقب كلام وتصرفات الجميع نهاراً وصوّت لكشف عصابة المافيا!' }
        };
        var st = { ph:'setup', nMafia: P.length >= 7 ? 2 : 1, doc:true, det:true, roster:[], i:0, open:false,
                   round:1, kill:null, save:null, check:null, checkOpen:false, news:'', vote:null, win:null, gave:false };

        function alive() { return st.roster.filter(function (r) { return r.alive; }); }
        function checkWin(ros) {
          var m = ros.filter(function (r) { return r.alive && r.role === 'mafia'; }).length;
          var g = ros.filter(function (r) { return r.alive && r.role !== 'mafia'; }).length;
          if (m === 0) return 'city'; if (m >= g) return 'mafia'; return null;
        }
        function endGame(team, ros) {
          st.win = team; st.ph = 'over'; celebrate();
          if (!st.gave) {
            var ids = ros.filter(function (r) { return team === 'mafia' ? r.role === 'mafia' : r.role !== 'mafia'; })
                         .map(function (r) { return r.p.id; });
            award(ids, team === 'mafia' ? 3 : 2); st.gave = true;
          }
          draw();
        }
        function begin() {
          var n = P.length, pool = [];
          var nm = Math.min(st.nMafia, Math.max(1, Math.floor((n - 1) / 2)));
          for (var i = 0; i < nm; i++) pool.push('mafia');
          if (st.doc && pool.length < n) pool.push('doctor');
          if (st.det && pool.length < n) pool.push('detective');
          while (pool.length < n) pool.push('citizen');
          pool = shuffle(pool);
          st.roster = P.map(function (p, i2) { return { p: p, role: pool[i2], alive: true }; });
          st.i = 0; st.open = false; st.round = 1; st.win = null; st.gave = false; st.ph = 'deal';
          sPop(); draw();
        }
        function toNight() {
          st.kill = null; st.save = null; st.check = null; st.checkOpen = false; st.vote = null;
          st.ph = 'n_mafia'; sPop(); draw();
        }
        function afterMafia() {
          var a = alive();
          if (a.some(function (r) { return r.role === 'doctor'; })) st.ph = 'n_doctor';
          else if (a.some(function (r) { return r.role === 'detective'; })) st.ph = 'n_det';
          else return morning();
          sPop(); draw();
        }
        function afterDoctor() {
          if (alive().some(function (r) { return r.role === 'detective'; })) st.ph = 'n_det';
          else return morning();
          sPop(); draw();
        }
        function morning() {
          var ros = st.roster.map(function (r) { return Object.assign({}, r); });
          if (st.kill && st.kill !== st.save) {
            ros = ros.map(function (r) { return r.p.id === st.kill ? Object.assign({}, r, { alive: false }) : r; });
            st.news = '🌅 طلع الصباح... للأسف هاجمت المافيا الليلة اللاعب «' + pName(st.kill) + '» وخرج من اللعبة!';
            sBuzz();
          } else {
            st.news = '🌅 طلع الصباح بخير! الطبيب تدخل في الوقت المناسب وأنقذ الضحية — لم يخرج أحد الليلة!';
            sPop();
          }
          st.roster = ros;
          var w = checkWin(ros);
          if (w) return endGame(w, ros);
          st.vote = null; st.ph = 'day'; draw();
        }
        function voteOut() {
          if (!st.vote) return;
          var t = st.roster.filter(function (r) { return r.p.id === st.vote; })[0];
          if (!t) return;
          st.roster = st.roster.map(function (r) { return r.p.id === st.vote ? Object.assign({}, r, { alive: false }) : r; });
          var w = checkWin(st.roster);
          if (w) return endGame(w, st.roster);
          st.news = '⚖️ صوّتت المدينة لإخراج «' + t.p.name + '» وكان دوره: ' + ROLES[t.role].t + '. تستمر اللعبة!';
          st.round++; toNight();
        }

        function draw() {
          if (st.ph === 'setup') {
            var maxM = Math.max(1, Math.floor((P.length - 1) / 2));
            host.innerHTML =
              '<div class="eg-hero" style="background:linear-gradient(160deg,#fdf2f5,#fbe7ee);border-color:#e2a9c0">' +
                '<div style="font-size:46px">🕶️</div><h3 style="color:#8e2c5c">إعداد جولة المافيا</h3>' +
                '<p>عدد اللاعبين المسجلين: <b>' + P.length + '</b> — وزّع الأدوار ثم مرّر الهاتف سراً.</p></div>' +
              '<div class="eg-panel">' +
                '<div style="font-family:var(--font-ui);font-weight:800;font-size:13px;margin-bottom:9px">عدد أفراد المافيا</div>' +
                '<div class="row" style="justify-content:flex-start">' +
                  '<button class="mini" id="mMinus">−</button>' +
                  '<span class="display tabnum" style="font-size:30px;color:var(--coral);min-width:44px;text-align:center">' + Math.min(st.nMafia, maxM) + '</span>' +
                  '<button class="mini plus" id="mPlus">+</button>' +
                  '<span style="font-size:11.5px;color:var(--muted);font-weight:700">(الأقصى المسموح: ' + maxM + ')</span>' +
                '</div>' +
                '<div class="eg-grid c2" style="margin-top:14px">' +
                  '<button class="pick' + (st.doc ? ' sel' : '') + '" id="tDoc" style="' + (st.doc ? 'background:#0e7566;border-color:#0e7566;color:#fff' : '') + '">🩺 الطبيب — يحمي شخصاً كل ليلة</button>' +
                  '<button class="pick' + (st.det ? ' sel' : '') + '" id="tDet" style="' + (st.det ? 'background:#2b4fb8;border-color:#2b4fb8;color:#fff' : '') + '">🔍 المحقق — يكشف هوية مشتبه به</button>' +
                '</div>' +
              '</div>' +
              '<button class="btn btn-primary" style="width:100%;padding:16px;font-size:17px" id="mStart">🕶️ وزّع الأدوار السرية وابدأ الجولة</button>';
            $('#mMinus', host).onclick = function () { st.nMafia = Math.max(1, st.nMafia - 1); sTick(520); draw(); };
            $('#mPlus', host).onclick = function () { st.nMafia = Math.min(maxM, st.nMafia + 1); sTick(700); draw(); };
            $('#tDoc', host).onclick = function () { st.doc = !st.doc; sPop(); draw(); };
            $('#tDet', host).onclick = function () { st.det = !st.det; sPop(); draw(); };
            $('#mStart', host).onclick = begin;
            return;
          }

          if (st.ph === 'deal') {
            var cur = st.roster[st.i], R = ROLES[cur.role];
            var partners = st.roster.filter(function (r) { return r.role === 'mafia' && r.p.id !== cur.p.id; });
            host.innerHTML =
              '<div class="eg-panel eg-center">' +
                '<span class="eg-label" style="background:var(--paper-2);color:var(--muted)">توزيع الأدوار السرية (' + (st.i + 1) + ' من ' + st.roster.length + ')</span>' +
                '<div style="font-size:42px;margin-top:10px">' + cur.p.av + '</div>' +
                '<h3 class="display" style="font-size:26px;margin:6px 0">مرّر الجهاز لـ «' + esc(cur.p.name) + '»</h3>' +
                (st.open
                  ? '<div class="role-card" style="background:' + R.bg + ';margin-top:12px">' +
                      '<span class="rc-em">' + R.em + '</span><div class="rc-t">' + R.t + '</div>' +
                      '<div class="rc-d">' + R.d + '</div>' +
                      (cur.role === 'mafia' && partners.length ? '<div class="rc-x">شريكك في المافيا: ' + partners.map(function (m) { return esc(m.p.name); }).join(' ، ') + '</div>' : '') +
                    '</div>' +
                    '<button class="btn btn-dark" style="width:100%;margin-top:12px" id="dNext">🙈 ' + (st.i + 1 < st.roster.length ? 'أخفِ البطاقة ومرر للاعب التالي' : 'أخفِ البطاقة وابدأ الليلة الأولى 🌙') + '</button>'
                  : '<p style="color:var(--muted);font-size:13.5px;margin:10px 0 14px">تأكد أن لا أحد ينظر للشاشة معك، ثم اكشف دورك السري!</p>' +
                    '<button class="btn btn-berry" style="width:100%;padding:15px;font-size:16px" id="dOpen">👁 اكشف دوري السري</button>') +
              '</div>';
            if (!st.open) $('#dOpen', host).onclick = function () { st.open = true; sPop(); draw(); };
            else $('#dNext', host).onclick = function () {
              st.open = false; sPop();
              if (st.i + 1 < st.roster.length) { st.i++; draw(); } else toNight();
            };
            return;
          }

          if (st.ph === 'n_mafia' || st.ph === 'n_doctor' || st.ph === 'n_det') {
            var isM = st.ph === 'n_mafia', isD = st.ph === 'n_doctor';
            var tag = isM ? ['🌙', 'دور المافيا', 'الجميع يغمض عينيه... تستيقظ المافيا! 🕶️', 'يا راوي اللعبة: اختر بصمت الضحية المستهدفة هذه الليلة', st.kill, 'kill']
                  : isD ? ['🌙', 'دور الطبيب', 'يستيقظ الطبيب فقط! 🩺', 'اختر لاعباً واحداً لحمايته الليلة (يمكنك حماية نفسك)', st.save, 'save']
                  : ['🌙', 'دور المحقق', 'يستيقظ المحقق فقط! 🔍', 'اختر لاعباً واحداً لكشف هويته الحقيقية بصمت', st.check, 'check'];
            var checked = st.roster.filter(function (r) { return r.p.id === st.check; })[0];

            host.innerHTML =
              '<div class="night stars eg-space">' +
                '<div class="row" style="justify-content:space-between">' +
                  '<span class="eg-label" style="background:rgba(245,179,36,.18);color:#f5b324">' + tag[0] + ' الليلة ' + st.round + ' • ' + tag[1] + '</span>' +
                '</div>' +
                '<div class="eg-center"><h3 style="color:#fff;font-family:var(--font-display);font-size:26px">' + tag[2] + '</h3>' +
                '<p style="color:rgba(232,236,255,.7);font-size:13px">' + tag[3] + '</p></div>' +
                (st.ph === 'n_det' && st.checkOpen && checked
                  ? '<div class="eg-panel" style="background:' + (checked.role === 'mafia' ? 'rgba(196,68,42,.2)' : 'rgba(14,117,102,.2)') + ';border-color:' + (checked.role === 'mafia' ? '#c4442a' : '#16a085') + ';text-align:center">' +
                      '<div style="font-size:12px;opacity:.8">نتيجة التحقيق السري حول «' + esc(checked.p.name) + '»:</div>' +
                      '<div class="display" style="font-size:26px;color:#fff;margin-top:4px">' + (checked.role === 'mafia' ? '🚨 من عصابة المافيا!' : '✅ بريء تماماً') + '</div>' +
                    '</div>' +
                    '<button class="btn btn-gold" style="width:100%;padding:15px" id="toMorning">☀️ أخفِ النتيجة وأعلن طلوع الصباح</button>'
                  : '<div class="eg-grid">' + alive().map(function (r) {
                      return '<button class="pick' + (tag[4] === r.p.id ? ' sel' : '') + '" data-pick="' + r.p.id + '">' +
                        '<span class="av" style="background:' + r.p.col + '">' + r.p.av + '</span><span>' + esc(r.p.name) + '</span></button>';
                    }).join('') + '</div>' +
                    '<button class="btn ' + (isM ? 'btn-primary' : isD ? 'btn-teal' : 'btn-dark') + '" style="width:100%;padding:15px" id="nGo" ' + (tag[4] ? '' : 'disabled') + '>' +
                      (isM ? '🌙 تأكيد اختيار المافيا' : isD ? '🩺 تأكيد الحماية' : '🔍 افحص هوية هذا اللاعب') + '</button>') +
              '</div>';

            $$('[data-pick]', host).forEach(function (b) {
              b.onclick = function () {
                if (isM) st.kill = b.dataset.pick; else if (isD) st.save = b.dataset.pick; else st.check = b.dataset.pick;
                sTick(680); draw();
              };
            });
            var go = $('#nGo', host);
            if (go) go.onclick = function () { if (isM) afterMafia(); else if (isD) afterDoctor(); else { st.checkOpen = true; sPop(); draw(); } };
            var tm = $('#toMorning', host);
            if (tm) tm.onclick = morning;
            return;
          }

          if (st.ph === 'day') {
            host.innerHTML =
              '<div class="eg-hero" style="background:linear-gradient(160deg,#fff6df,#ffeccd);border-color:var(--gold)">' +
                '<span class="eg-label" style="background:var(--ink);color:var(--gold)">☀️ نهار الجولة ' + st.round + ' • النقاش والتصويت</span>' +
                '<p style="font-family:var(--font-ui);font-weight:800;font-size:15px;color:var(--ink-text);margin-top:9px">' + esc(st.news) + '</p>' +
                '<p style="font-size:12.5px">تناقشوا الآن! من يتصرف بريبة؟ اختاروا المشتبه به للتصويت على إخراجه.</p>' +
              '</div>' +
              '<div class="eg-grid">' + st.roster.map(function (r) {
                return '<button class="pick' + (st.vote === r.p.id ? ' sel' : '') + '" data-vote="' + r.p.id + '" ' + (r.alive ? '' : 'disabled') + '>' +
                  '<span class="av" style="background:' + r.p.col + '">' + r.p.av + '</span><span>' + esc(r.p.name) + '</span>' +
                  (r.alive ? '' : '<span style="font-size:10px;color:var(--coral);font-weight:800">خرج</span>') + '</button>';
              }).join('') + '</div>' +
              '<div class="row">' +
                '<button class="btn btn-primary" style="flex:1;min-width:220px;padding:15px" id="vGo" ' + (st.vote ? '' : 'disabled') + '>⚖️ تصويت الأغلبية: إخراج اللاعب المحدد</button>' +
                '<button class="btn btn-soft" id="vSkip">⬅️ تخطي التصويت</button>' +
              '</div>';
            $$('[data-vote]', host).forEach(function (b) {
              b.onclick = function () { if (b.disabled) return; st.vote = b.dataset.vote; sTick(680); draw(); };
            });
            $('#vGo', host).onclick = voteOut;
            $('#vSkip', host).onclick = function () { st.round++; toNight(); };
            return;
          }

          // over
          host.innerHTML =
            '<div class="result-box" style="background:' + (st.win === 'city' ? '#e6f6f1' : '#ffece6') + ';border-color:' + (st.win === 'city' ? '#0e7566' : '#c4442a') + '">' +
              '<div style="font-size:44px">🏆</div>' +
              '<h3 style="color:' + (st.win === 'city' ? '#0b5d51' : '#8d2d16') + '">' + (st.win === 'city' ? '🎉 انتصر أهل المدينة والمحققون!' : '🕶️ سيطرت عصابة المافيا على المدينة!') + '</h3>' +
              '<p style="color:var(--muted)">تمت إضافة النقاط تلقائياً للفريق الفائز في لوحة الصدارة.</p></div>' +
            '<div class="eg-panel"><div style="font-size:12px;font-weight:800;color:var(--muted);margin-bottom:9px">كشف جميع الأدوار الحقيقية:</div>' +
              '<div class="eg-grid">' + st.roster.map(function (r) {
                return '<div class="pick" style="cursor:default;justify-content:space-between">' +
                  '<span style="display:flex;align-items:center;gap:7px;min-width:0"><span class="av" style="background:' + r.p.col + '">' + r.p.av + '</span>' +
                  '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(r.p.name) + '</span></span>' +
                  '<span class="eg-label" style="background:' + (r.role === 'mafia' ? '#c4442a' : r.role === 'doctor' ? '#0e7566' : r.role === 'detective' ? '#2b4fb8' : '#a9720a') + ';color:#fff">' + ROLES[r.role].em + ' ' + ROLES[r.role].t + '</span></div>';
              }).join('') + '</div></div>' +
            '<button class="btn btn-dark" style="width:100%;padding:15px" id="mAgain">🔄 جولة مافيا جديدة</button>';
          $('#mAgain', host).onclick = function () { st.ph = 'setup'; sPop(); draw(); };
        }
        draw();
      };

      /* ==================== 2/3) IMPOSTER & SPYFALL ==================== */
      function imposterEngine(host, mode) {
        var P = S.players.slice();
        var st = { ph:'setup', cat:'all', spy:'', word:'', catLabel:'', roles:{}, opts:[], i:0, open:false,
                   pairs:[], pi:0, vote:null, guess:null, out:null };

        function buildPairs() {
          var s = shuffle(P); st.pairs = s.map(function (a, i) { return [a, s[(i + 1) % s.length]]; }); st.pi = 0;
        }
        function start() {
          var spy = pick(P); st.spy = spy.id;
          if (mode === 'imposter') {
            var cat = st.cat === 'all' ? pick(IMPOSTER_CATS) : IMPOSTER_CATS.filter(function (c) { return c.id === st.cat; })[0];
            var w = pick(cat.words);
            st.word = w; st.catLabel = cat.em + ' ' + cat.label;
            st.opts = shuffle(cat.words.filter(function (x) { return x !== w; }).slice(0, 5).concat([w]));
          } else {
            var loc = pick(SPYFALL);
            st.word = loc.em + ' ' + loc.name; st.catLabel = 'المكان السري';
            var rm = {};
            P.forEach(function (p, i) { if (p.id !== spy.id) rm[p.id] = loc.roles[i % loc.roles.length]; });
            st.roles = rm;
            st.opts = shuffle(SPYFALL.filter(function (l) { return l.name !== loc.name; }).slice(0, 5).map(function (l) { return l.em + ' ' + l.name; }).concat([st.word]));
          }
          buildPairs(); st.i = 0; st.open = false; st.vote = null; st.guess = null; st.out = null; st.ph = 'deal';
          sPop(); draw();
        }
        function confirmVote() {
          if (!st.vote) return;
          if (st.vote === st.spy) { st.ph = 'guess'; sPop(); draw(); return; }
          sBuzz(); award([st.spy], 3);
          st.out = { ok: false, t: '🕵️ خدعكم «' + pName(st.spy) + '» وفاز بالجولة!',
            s: 'صوّتتم بالخطأ على «' + pName(st.vote) + '»، بينما السر كان: (' + st.word + '). كسب ' + (mode === 'imposter' ? 'الدخيل' : 'الجاسوس') + ' +3 نقاط!' };
          st.ph = 'result'; draw();
        }
        function doGuess(g) {
          st.guess = g;
          if (g === st.word) {
            celebrate(); award([st.spy], 2);
            st.out = { ok: true, t: '🔥 ذكاء خارق! «' + pName(st.spy) + '» انكشف لكنه عرف السر!', s: 'خمن «' + st.word + '» بشكل صحيح وخطف +2 نقطتين!' };
          } else {
            celebrate(); award(P.filter(function (p) { return p.id !== st.spy; }).map(function (p) { return p.id; }), 1);
            st.out = { ok: true, t: '🎉 برافو يا أبطال! قبضتم على «' + pName(st.spy) + '»!', s: 'فشل في تخمين «' + st.word + '» (اختار: ' + g + ') — حصل باقي اللاعبين على +1 نقطة لكل فرد!' };
          }
          st.ph = 'result'; draw();
        }

        function draw() {
          if (st.ph === 'setup') {
            host.innerHTML =
              (mode === 'imposter'
                ? '<div class="eg-panel"><div style="font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:10px">اختر موضوع الكلمة السرية لهذه الجولة:</div>' +
                  '<div class="eg-grid c2"><button class="opt' + (st.cat === 'all' ? ' sel' : '') + '" data-c="all">🎲 كوكتيل عشوائي</button>' +
                  IMPOSTER_CATS.map(function (c) { return '<button class="opt' + (st.cat === c.id ? ' sel' : '') + '" data-c="' + c.id + '">' + c.em + ' ' + c.label + '</button>'; }).join('') + '</div></div>'
                : '<div class="eg-hero" style="background:linear-gradient(160deg,#eef2ff,#e2e9ff);border-color:#a9b8f0">' +
                    '<div style="font-size:44px">🗺️</div><h3 style="color:#2b4fb8">جاهزون لمعرفة المكان السري؟</h3>' +
                    '<p>الجميع في نفس المكان (عرس مغربي، حمام بلدي، مطار...) بدور محدد، ما عدا جاسوس واحد فقط!</p></div>') +
              '<button class="btn btn-primary" style="width:100%;padding:16px;font-size:17px" id="iStart">🕵️ ابدأ التوزيع السري على (' + P.length + ') لاعبين</button>';
            $$('[data-c]', host).forEach(function (b) { b.onclick = function () { st.cat = b.dataset.c; sTick(680); draw(); }; });
            $('#iStart', host).onclick = start;
            return;
          }

          if (st.ph === 'deal') {
            var p = P[st.i], isSpy = p.id === st.spy;
            host.innerHTML =
              '<div class="eg-panel eg-center">' +
                '<span class="eg-label" style="background:var(--paper-2);color:var(--muted)">اللاعب ' + (st.i + 1) + ' من ' + P.length + ' • ' + esc(st.catLabel) + '</span>' +
                '<div style="font-size:42px;margin-top:10px">' + p.av + '</div>' +
                '<h3 class="display" style="font-size:25px;margin:6px 0">أعطِ الهاتف لـ «' + esc(p.name) + '»</h3>' +
                (st.open
                  ? (isSpy
                      ? '<div class="role-card" style="background:linear-gradient(160deg,#c4442a,#8e2c5c)"><span class="rc-em">🕵️‍♂️</span>' +
                        '<div class="rc-t">' + (mode === 'imposter' ? 'أنت الدخيل (Imposter)!' : 'أنت الجاسوس السري!') + '</div>' +
                        '<div class="rc-d">' + (mode === 'imposter'
                          ? 'التصنيف هو (' + esc(st.catLabel) + ') — تظاهر بأنك تعرف الكلمة واستنتجها من أسئلة العائلة!'
                          : 'أنت لا تعرف المكان! ركّز في أسئلة البقية لتكتشف أين أنتم دون أن يشكوا فيك!') + '</div></div>'
                      : '<div class="role-card" style="background:linear-gradient(160deg,#16a085,#0b5d51)">' +
                        '<div class="rc-d" style="margin:0 0 6px;font-size:11.5px;letter-spacing:1px">' + esc(st.catLabel) + '</div>' +
                        '<div class="rc-t" style="font-size:30px">' + esc(st.word) + '</div>' +
                        (mode === 'spyfall' && st.roles[p.id] ? '<div class="rc-x">دورك في المكان: ' + esc(st.roles[p.id]) + '</div>' : '') +
                        '<div class="rc-d">لا تفضح السر بسهولة حتى لا يفهمه ' + (mode === 'imposter' ? 'الدخيل' : 'الجاسوس') + '!</div></div>') +
                    '<button class="btn btn-dark" style="width:100%;margin-top:12px" id="iNext">🙈 ' + (st.i + 1 < P.length ? 'إخفاء وتمرير للتالي' : 'إخفاء وبدء جولة الأسئلة!') + '</button>'
                  : '<p style="color:var(--muted);font-size:13.5px;margin:10px 0 14px">اضغط لرؤية بطاقتك السرية بعيداً عن أعين البقية!</p>' +
                    '<button class="btn btn-berry" style="width:100%;padding:15px;font-size:16px" id="iOpen">👁 اكشف بطاقتي</button>') +
              '</div>';
            if (!st.open) $('#iOpen', host).onclick = function () { st.open = true; sPop(); draw(); };
            else $('#iNext', host).onclick = function () {
              st.open = false; sPop();
              if (st.i + 1 < P.length) { st.i++; draw(); } else { st.ph = 'q'; draw(); }
            };
            return;
          }

          if (st.ph === 'q') {
            var pr = st.pairs[st.pi % st.pairs.length];
            host.innerHTML =
              '<div class="eg-hero" style="background:linear-gradient(160deg,#fdf2f5,#f9e3ec);border-color:#e2a9c0">' +
                '<span class="eg-label" style="background:#8e2c5c;color:#fff">❓ فقرة الاستجواب الذكي • ' + esc(st.catLabel) + '</span>' +
                '<h3 style="color:#8e2c5c;margin-top:10px">يا «' + esc(pr[0].name) + '» اسأل «' + esc(pr[1].name) + '» سؤالاً ذكياً!</h3>' +
                '<p>اسأل سؤالاً يثبت معرفتك دون كشف الإجابة مباشرة أمام ' + (mode === 'imposter' ? 'الدخيل' : 'الجاسوس') + '!</p>' +
                '<button class="btn btn-soft" style="margin-top:10px" id="qNext">🔄 سؤال تالٍ بين لاعبين</button>' +
              '</div>' +
              (mode === 'spyfall'
                ? '<div class="eg-panel"><div style="font-size:12px;font-weight:800;color:var(--muted);margin-bottom:8px">الأماكن الممكنة (لمساعدة الجميع والجاسوس):</div>' +
                  '<div class="chips">' + SPYFALL.map(function (l) { return '<span class="chip" style="cursor:default">' + l.em + ' ' + l.name + '</span>'; }).join('') + '</div></div>'
                : '') +
              '<button class="btn btn-primary" style="width:100%;padding:16px;font-size:17px" id="qVote">🗳️ انتهينا من الأسئلة — انتقل للتصويت!</button>';
            $('#qNext', host).onclick = function () { st.pi++; sPop(); draw(); };
            $('#qVote', host).onclick = function () { st.ph = 'vote'; sPop(); draw(); };
            return;
          }

          if (st.ph === 'vote') {
            host.innerHTML =
              '<div class="eg-center"><h3 class="display" style="font-size:26px">وقت الحسم! من هو ' + (mode === 'imposter' ? 'الدخيل' : 'الجاسوس') + ' برأيكم؟</h3>' +
              '<p style="color:var(--muted);font-size:13px;margin-bottom:12px">اتفقوا أو صوّتوا بالأغلبية واضغطوا على اسم اللاعب المشتبه به:</p></div>' +
              '<div class="eg-grid">' + P.map(function (p) {
                return '<button class="pick' + (st.vote === p.id ? ' sel' : '') + '" data-v="' + p.id + '">' +
                  '<span class="av" style="background:' + p.col + '">' + p.av + '</span><span>' + esc(p.name) + '</span></button>';
              }).join('') + '</div>' +
              '<button class="btn btn-dark" style="width:100%;padding:15px;font-size:16px" id="vDo" ' + (st.vote ? '' : 'disabled') + '>🔍 اكشف الحقيقة!</button>';
            $$('[data-v]', host).forEach(function (b) { b.onclick = function () { st.vote = b.dataset.v; sTick(680); draw(); }; });
            $('#vDo', host).onclick = confirmVote;
            return;
          }

          if (st.ph === 'guess') {
            host.innerHTML =
              '<div class="eg-hero" style="background:linear-gradient(160deg,#fff6df,#ffeccd);border-color:var(--gold)">' +
                '<div style="font-size:40px">⚠️</div>' +
                '<h3 style="color:#a9720a">أحسنتم! كشفتم «' + esc(pName(st.spy)) + '» فعلاً 👏</h3>' +
                '<p>لكن مهلاً... يا <b>' + esc(pName(st.spy)) + '</b> لديك فرصة أخيرة لسرقة الفوز إذا خمّنت ' +
                (mode === 'imposter' ? 'الكلمة السرية' : 'المكان السري') + ' من هذه الخيارات الستة:</p></div>' +
              '<div class="eg-grid c2">' + st.opts.map(function (o) {
                return '<button class="opt" data-g="' + esc(o) + '">' + esc(o) + '</button>';
              }).join('') + '</div>';
            $$('[data-g]', host).forEach(function (b) { b.onclick = function () { doGuess(b.dataset.g); }; });
            return;
          }

          host.innerHTML =
            '<div class="result-box" style="background:' + (st.out.ok ? '#fff6df' : '#e6f6f1') + ';border-color:' + (st.out.ok ? '#f5b324' : '#0e7566') + '">' +
              '<div style="font-size:42px">' + (st.out.ok ? '🎯' : '🎉') + '</div>' +
              '<h3 style="color:var(--ink-text)">' + esc(st.out.t) + '</h3><p style="color:var(--muted)">' + esc(st.out.s) + '</p>' +
              (st.guess ? '<p style="font-size:12px;color:var(--ink-text);margin-top:8px"><b>السر الحقيقي:</b> ' + esc(st.word) + '</p>' : '') +
            '</div>' +
            '<button class="btn btn-primary" style="width:100%;padding:15px;font-size:16px" id="iAgain">🔄 العب جولة جديدة</button>';
          $('#iAgain', host).onclick = function () { st.ph = 'setup'; sPop(); draw(); };
        }
        draw();
      }
      ENG.imposter = function (host) { imposterEngine(host, 'imposter'); };
      ENG.spyfall = function (host) { imposterEngine(host, 'spyfall'); };

      /* ==================== 4) WHEEL ==================== */
      ENG.wheel = function (host) {
        var st = { mode:'players', custom:['نتفرجو فيلم عائلي 🍿','نصاوبو أتاي وحلوى ☕','نلعبو المافيا 🕶️','اللي خسر يجمع الصالون 🧹'],
                   rot:0, spin:false, win:null, bonus:'', rewarded:false };

        function items() {
          if (st.mode === 'players') return S.players.map(function (p) { return { id:p.id, lab:p.av + ' ' + p.name, full:p.av + ' ' + p.name }; });
          if (st.mode === 'challenges') return WHEEL_CHALLENGES.slice(0, 8).map(function (c, i) { return { id:'c' + i, lab:c.length > 19 ? c.slice(0, 19) + '…' : c, full:c }; });
          return st.custom.map(function (c, i) { return { id:'u' + i, lab:c.length > 19 ? c.slice(0, 19) + '…' : c, full:c }; });
        }
        function pol(cx, cy, r, a) { var rad = (a - 90) * Math.PI / 180; return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) }; }
        function arc(a0, a1) {
          var s = pol(150, 150, 148, a1), e = pol(150, 150, 148, a0), la = (a1 - a0) <= 180 ? '0' : '1';
          return 'M 150 150 L ' + s.x + ' ' + s.y + ' A 148 148 0 ' + la + ' 0 ' + e.x + ' ' + e.y + ' Z';
        }
        function spin() {
          var it = items();
          if (st.spin || it.length < 2) return;
          st.spin = true; st.win = null; st.rewarded = false; draw();
          var chosen = rnd(it.length), sl = 360 / it.length;
          var jitter = (Math.random() - 0.5) * sl * 0.5;
          var target = (360 - (chosen + 0.5) * sl + jitter + 360) % 360;
          var cur = ((st.rot % 360) + 360) % 360;
          st.rot += 360 * 5 + ((target - cur + 360) % 360);
          var svg = $('#wSvg', host);
          var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (svg) { svg.getBoundingClientRect(); svg.style.transform = 'rotate(' + st.rot + 'deg)'; }
          var n = 0;
          function tickRun() {
            if (n >= 18 || !st.spin || !document.body.contains(host)) return;
            sTick(500 + (n % 3) * 90); n++;
            setTimeout(tickRun, 62 + n * 12);
          }
          if (!reduced) tickRun();
          setTimeout(function () {
            if (!document.body.contains(host)) return;
            st.spin = false; st.win = chosen; st.bonus = pick(WHEEL_CHALLENGES); st.rot %= 360;
            celebrate(); draw();
          }, reduced ? 130 : 4150);
        }
        function draw() {
          var it = items();
          var slices = it.map(function (o, i) {
            var sl = 360 / it.length, a0 = i * sl, a1 = a0 + sl, mid = a0 + sl / 2, lp = pol(150, 150, 96, mid);
            return '<path d="' + arc(a0, a1) + '" fill="' + WEDGE_COLORS[i % WEDGE_COLORS.length] + '" stroke="#fbf6ec" stroke-width="2.5"/>' +
              '<text x="' + lp.x + '" y="' + lp.y + '" fill="#fff" font-size="' + (it.length > 8 ? 10 : 12.5) + '" font-weight="800" text-anchor="middle" dominant-baseline="middle" ' +
              'transform="rotate(' + (mid - 90) + ',' + lp.x + ',' + lp.y + ')" style="font-family:var(--font-ui)">' + esc(o.lab) + '</text>';
          }).join('');

          host.innerHTML =
            '<div class="row">' +
              [['players','👥 عجلة اللاعبين'],['challenges','⚡ عجلة الأحكام والحظ'],['custom','✏️ عجلة مخصصة']].map(function (t) {
                return '<button class="btn ' + (st.mode === t[0] ? 'btn-dark' : 'btn-soft') + '" data-m="' + t[0] + '" aria-pressed="' + (st.mode === t[0]) + '"' + (st.spin ? ' disabled' : '') + '>' + t[1] + '</button>';
              }).join('') +
            '</div>' +
            (st.mode === 'custom'
              ? '<div class="eg-panel tint"><form class="add-row" id="cForm" style="margin-top:0">' +
                  '<input class="field" id="cInput" aria-label="خيار جديد فالعجلة" maxlength="60" placeholder="أضف خياراً فالعجلة…"' + (st.spin || st.custom.length >= 12 ? ' disabled' : '') + ' />' +
                  '<button class="btn btn-primary" type="submit"' + (st.spin || st.custom.length >= 12 ? ' disabled' : '') + '>+ أضف</button></form>' +
                  '<div class="chips" style="margin-top:10px">' + st.custom.map(function (c, i) {
                    return st.custom.length <= 2 ? '<span class="chip">' + esc(c) + '</span>' : '<button class="chip" aria-label="حذف ' + esc(c) + '" data-rm="' + i + '"' + (st.spin ? ' disabled' : '') + '>' + esc(c) + ' ✕</button>';
                  }).join('') + '</div></div>'
              : '') +
            '<div class="wheel-stage">' +
              '<div class="wheel-pointer"></div>' +
              '<div class="wheel-box' + (st.spin ? ' spinning' : '') + '">' +
                '<svg id="wSvg" viewBox="0 0 300 300" style="transform:rotate(' + st.rot + 'deg)">' + slices +
                  '<circle cx="150" cy="150" r="26" fill="#fbf6ec" stroke="#06231d" stroke-width="4"/>' +
                  '<text x="150" y="152" text-anchor="middle" dominant-baseline="middle" font-size="18">🎡</text>' +
                '</svg></div>' +
               '<button class="btn btn-primary" style="padding:15px 34px;font-size:17px" id="wSpin" data-tv-start ' + (st.spin || it.length < 2 ? 'disabled' : '') + '>' +
                (st.spin ? '🌀 العجلة تدور...' : '✨ دوّر عجلة الحظ الآن!') + '</button>' +
            '</div>' +
            (st.win !== null && !st.spin
              ? '<div class="eg-hero" style="background:linear-gradient(160deg,#fff6df,#ffeccd);border-color:var(--gold)">' +
                  '<span class="eg-label" style="background:#a9720a;color:#fff">وقفت العجلة على</span>' +
                  '<div class="display" style="font-size:clamp(24px,4.6vw,34px);color:var(--ink-text);margin-top:8px">' + esc(it[st.win].full) + '</div>' +
                  (st.mode === 'players'
                    ? '<div class="eg-panel" style="margin-top:12px;text-align:right"><b style="color:#a9720a">حكم مقترح له: </b>' + esc(st.bonus) + '</div>' +
                      (st.rewarded ? '<p>✓ تضافت النقطة.</p>' : '<button class="btn btn-teal" style="margin-top:12px" id="wAward">🏅 امنح +1 نقطة حظ لهذا اللاعب</button>')
                    : '') +
                '</div>'
              : '');

          $$('[data-m]', host).forEach(function (b) { b.onclick = function () { st.mode = b.dataset.m; st.win = null; sPop(); draw(); }; });
          var ws = $('#wSpin', host); if (ws) ws.onclick = spin;
          var wa = $('#wAward', host);
          if (wa) wa.onclick = function () {
            var cur = items();
             if (st.win === null || !cur[st.win] || st.rewarded) return;
             st.rewarded = true; award([cur[st.win].id], 1); celebrate(); draw();
          };
          var cf = $('#cForm', host);
          if (cf) cf.onsubmit = function (e) {
            e.preventDefault();
            var v = $('#cInput', host).value.trim();
            if (!v) return;
            st.custom.push(v); st.win = null; sPop(); draw();
          };
          $$('[data-rm]', host).forEach(function (b) {
            b.onclick = function () { st.custom.splice(parseInt(b.dataset.rm, 10), 1); st.win = null; draw(); };
          });
        }
        draw();
      };

      /* ==================== 5) TRUTH OR DARE ==================== */
      ENG.truth_or_dare = function (host) {
        var st = { mood:'all', ti:0, ai:1, card:null, used:[], gave:false };
        function P() { return S.players; }
        function draw() {
          var ps = P(), t = ps[st.ti % ps.length], a = ps[st.ai % ps.length];
          host.innerHTML =
            '<div class="eg-panel tint"><div class="row" style="justify-content:space-between">' +
              '<span style="font-size:12px;font-weight:800;color:var(--muted)">أجواء الأسئلة:</span>' +
              '<div class="row">' + [['all','متنوع 🎲'],['light','عائلي دافئ 🌸'],['funny','مضحك وحماسي 😂']].map(function (m) {
                return '<button class="btn ' + (st.mood === m[0] ? 'btn-dark' : 'btn-soft') + '" style="padding:7px 13px;font-size:12px" data-mood="' + m[0] + '">' + m[1] + '</button>';
              }).join('') + '</div></div></div>' +

            '<div class="eg-panel eg-center">' +
              '<div class="row">' +
                '<span class="eg-label" style="background:#fff6df;color:#a9720a">🎤 السائل: ' + a.av + ' ' + esc(a.name) + '</span>' +

            '</div>' +

            (st.card
              ? '<div class="eg-hero" style="background:' + (st.card.t === 'truth' ? 'linear-gradient(160deg,#eef2ff,#e2e9ff)' : 'linear-gradient(160deg,#fff1e8,#ffe4d6)') + ';border-color:' + (st.card.t === 'truth' ? '#a9b8f0' : '#f2b8a6') + '">' +
                  '<span class="eg-label" style="background:' + (st.card.t === 'truth' ? '#2b4fb8' : 'var(--coral)') + ';color:#fff">' + (st.card.t === 'truth' ? '💬 بطاقة صراحة وحقيقة' : '⚡ بطاقة تحدي عائلي') + '</span>' +

                  '<button class="btn btn-primary" style="flex-direction:column;padding:22px;gap:6px" id="tdDare"><span style="font-size:30px">⚡</span><span style="font-size:19px;font-family:var(--font-display)">تحدي عائلي</span><span style="font-size:11.5px;opacity:.85;font-weight:700">نفّذ المهمة الطريفة بشجاعة!</span></button>' +
                  '<button class="btn btn-gold" style="flex-direction:column;padding:22px;gap:6px" id="tdLuck"><span style="font-size:30px">🎲</span><span style="font-size:19px;font-family:var(--font-display)">أنت وحظك!</span><span style="font-size:11.5px;opacity:.85;font-weight:700">دع النظام يختار لك مفاجأة!</span></button>' +
                '</div>');

          $$('[data-mood]', host).forEach(function (b) { b.onclick = function () { st.mood = b.dataset.mood; sTick(680); draw(); }; });
          $('#tdRnd', host).onclick = function () {
            var n = ps.length, x = rnd(n), y = rnd(n);

          };
          $('#tdNext', host).onclick = function () {
            st.ti = (st.ti + 1) % ps.length; st.ai = (st.ti + 1) % ps.length; st.card = null; st.gave = false; sPop(); draw();
          };

          function pickCard(choice) {
            var type = choice === 'random' ? (Math.random() < 0.5 ? 'truth' : 'dare') : choice;
            var pool = TOD.map(function (o, i) { return { o: o, i: i }; }).filter(function (e) {
              return e.o.t === type && (st.mood === 'all' || e.o.l === st.mood) && st.used.indexOf(e.i) === -1;
            });
            if (!pool.length) pool = TOD.map(function (o, i) { return { o: o, i: i }; }).filter(function (e) { return e.o.t === type; });
            var e = pick(pool);

      /* ==================== 6) TIMER CARD GAMES ==================== */
      var DUR = { five_seconds:5, sing_word:20, taboo:45, no_laugh:45, heads_up:90, charades:60 };

      function timerCardEngine(host, mode) {
        var D = DUR[mode] || 60;
        var st = { ti:0, ci:rnd(40), open: mode !== 'charades' && mode !== 'heads_up', left:D, run:false, done:false,
                   exploded:false, fuse:18, elapsed:0 };
        var timer = null, fuseTimer = null;

        function clearTimers() { if (timer) clearInterval(timer); if (fuseTimer) clearInterval(fuseTimer); timer = fuseTimer = null; }
        function reset(advPlayer) {
          clearTimers();
          st.run = false; st.done = false; st.exploded = false; st.left = D;
          st.ci += 1 + rnd(3); st.open = mode !== 'charades' && mode !== 'heads_up';
          if (advPlayer) st.ti = (st.ti + 1) % S.players.length;
          draw();
        }
        function startTimer() {
          if (st.run) return;
          if (st.left <= 0) st.left = D;
          st.done = false; st.run = true; draw();
          if (mode === 'word_bomb') {
            st.fuse = 12 + rnd(15); st.elapsed = 0;
            fuseTimer = setInterval(function () {
              st.elapsed += 0.5;
              var ratio = st.elapsed / st.fuse;
              sTick(460 + Math.min(460, ratio * 440));
              if (st.elapsed >= st.fuse) {
                clearTimers(); st.run = false; st.exploded = true; st.done = true; sBoom(); draw();
              }
            }, 500);
            return;
          }
          var stepMs = mode === 'five_seconds' ? 100 : 1000;
          var stepVal = mode === 'five_seconds' ? 0.1 : 1;
          timer = setInterval(function () {
            st.left = Math.max(0, Number((st.left - stepVal).toFixed(1)));
            if (mode === 'five_seconds' && Math.round(st.left * 10) % 10 === 0 && st.left > 0) sTick(760);
            else if (mode !== 'five_seconds' && st.left <= 5 && st.left > 0) sTick(780);
            updateTimerUI();
            if (st.left <= 0) { clearTimers(); st.run = false; st.done = true; sBuzz(); draw(); }
          }, stepMs);
        }
        function updateTimerUI() {
          var b = $('#tBadge', host), bar = $('#tBar', host);
          if (b) {
            b.textContent = '⏱️ ' + (mode === 'five_seconds' ? st.left.toFixed(1) : st.left) + ' ث';
            b.className = 'timer-badge' + (st.left <= (mode === 'five_seconds' ? 2 : 10) ? ' danger' : '');
          }
          if (bar) bar.style.width = (mode === 'five_seconds' ? (st.left / 5) * 100 : (st.left / D) * 100) + '%';
        }

        function cardHTML() {
          var a = S.players[st.ti % S.players.length], b2 = S.players[(st.ti + 1) % S.players.length];
          if (mode === 'charades') {

            return '<span class="eg-label" style="background:#e0f4ef;color:#0b5d51">🎭 التصنيف: ' + esc(c.c) + '</span>' +

                ? '<div class="kw" style="color:var(--ink-text);margin-top:10px">' + esc(c.w) + '</div>' +
                  '<button class="btn btn-dark" style="margin-top:12px" id="cHide">🙈 أخفِ الكلمة وابدأ التمثيل!</button>'
                : '<p style="color:var(--muted);font-size:13.5px;margin:12px 0">ليشاهد «' + esc(a.name) + '» الكلمة وحده ثم يخفيها ويمثلها بدون كلام!</p>' +
                  '<button class="btn btn-teal" style="padding:14px 22px" id="cShow">👁 اكشف الكلمة للممثل</button>');
          }
          if (mode === 'five_seconds') {
            return '<span class="eg-label" style="background:#e6f6f1;color:#0b5d51">⏱️ سمِّ 3 إجابات في 5 ثوانٍ!</span>' +
              '<div class="kw" style="color:var(--ink-text);margin-top:10px">' + esc(FIVE_SEC[st.ci % FIVE_SEC.length]) + '</div>' +
              '<div class="bar" style="margin-top:14px"><i id="tBar" style="width:' + (st.left / 5) * 100 + '%"></i></div>';
          }
          if (mode === 'taboo') {
            var t = TABOO[st.ci % TABOO.length];
            return '<div style="font-size:12px;font-weight:800;color:var(--muted)">اشرح هذه الكلمة للعائلة:</div>' +
              '<div class="kw" style="color:#0b5d51;background:#e6f6f1;border:2px solid #a9ddce;border-radius:18px;padding:12px;margin-top:8px">' + esc(t.w) + '</div>' +
              '<div style="margin-top:14px"><div style="font-size:12px;font-weight:800;color:var(--coral)">🚫 ممنوع تماماً نطق هذه الكلمات الأربع:</div>' +
              '<div class="forbid" style="margin-top:8px">' + t.f.map(function (w) { return '<span>' + esc(w) + '</span>'; }).join('') + '</div></div>';
          }
          if (mode === 'heads_up') {
            var h = HEADS_UP[st.ci % HEADS_UP.length];
            return '<span class="eg-label" style="background:#eef2ff;color:#2b4fb8">⚠️ لا ينظر «' + esc(a.name) + '» للشاشة! البقية يجاوبونه بنعم أو لا فقط</span>' +
              '<div style="font-size:12.5px;color:var(--muted);margin-top:10px">التلميح العام: ' + esc(h.h) + '</div>' +
              '<div class="kw" style="font-size:clamp(30px,6vw,50px);color:var(--ink-text);margin-top:6px">«' + esc(h.t) + '»</div>';
          }
          if (mode === 'no_laugh') {
            return '<span class="eg-label" style="background:#f0f5e2;color:#4a6114">🤭 ممنوع الابتسام أو الضحك!</span>' +
              '<div style="font-family:var(--font-ui);font-weight:800;font-size:18px;color:var(--ink-text);margin-top:12px;line-height:1.8">' + esc(NO_LAUGH[st.ci % NO_LAUGH.length]) + '</div>';
          }
          if (mode === 'sing_word') {
            return '<span class="eg-label" style="background:#e0f4ef;color:#0b5d51">🎤 أسرع شخص يغني مقطعاً حقيقياً فيه كلمة:</span>' +
              '<div class="display" style="font-size:clamp(38px,8vw,64px);color:var(--coral);margin-top:8px">«' + esc(SING_WORDS[st.ci % SING_WORDS.length]) + '»</div>';
          }
          return '';
        }

        function draw() {
          var ps = S.players, a = ps[st.ti % ps.length], b2 = ps[(st.ti + 1) % ps.length];

          if (mode === 'word_bomb') {
            host.innerHTML =
              '<div class="eg-hero" style="background:linear-gradient(160deg,#fff1e8,#ffe0d0);border-color:#f2a58f">' +
                '<div style="font-size:64px" class="' + (st.run ? 'bomb-anim' : '') + '">' + (st.exploded ? '💥' : '💣') + '</div>' +
                '<span class="eg-label" style="background:var(--coral);color:#fff;margin-top:6px">شرط الكلمات في هذه الجولة</span>' +
                '<div class="kw" style="color:var(--ink-text);margin-top:10px">' + esc(BOMB_PROMPTS[st.ci % BOMB_PROMPTS.length]) + '</div>' +
                (!st.run && !st.exploded
                  ? '<button class="btn btn-primary" style="width:100%;padding:16px;font-size:17px;margin-top:14px" id="bLit">🔥 أشعل فتيل القنبلة وابدأ!</button>'
                  : '') +
                (st.run
                  ? '<div class="eg-panel" style="margin-top:14px"><div style="font-size:11.5px;font-weight:800;color:var(--muted)">القنبلة الآن في يد:</div>' +
                    '<div class="display" style="font-size:30px;color:var(--coral)">' + a.av + ' ' + esc(a.name) + '</div></div>' +
                    '<button class="btn btn-teal" style="width:100%;padding:16px;font-size:16px;margin-top:10px" id="bPass">✅ جاوب صح! مرّر القنبلة لـ «' + esc(b2.name) + '» ⏩</button>'
                  : '') +
                (st.exploded
                  ? '<div class="eg-panel" style="margin-top:14px;background:var(--coral);border-color:var(--coral-deep);color:#fff;text-align:center">' +
                      '<div class="display" style="font-size:24px">💥 بووووم! انفجرت القنبلة عند «' + esc(a.name) + '»!</div>' +
                      '<div style="font-size:12px;opacity:.92;margin-top:4px">كسب باقي اللاعبين الناجين +1 نقطة!</div></div>' +
                    '<button class="btn btn-dark" style="width:100%;padding:15px;margin-top:10px" id="bNext">🔄 منح النقاط للناجين وبدء جولة جديدة</button>'
                  : '') +
              '</div>';
            var lit = $('#bLit', host); if (lit) lit.onclick = function () { sPop(); startTimer(); };
            var bp = $('#bPass', host); if (bp) bp.onclick = function () { st.ti = (st.ti + 1) % ps.length; sPop(); draw(); };
            var bn = $('#bNext', host);
            if (bn) bn.onclick = function () {
              award(ps.filter(function (p) { return p.id !== a.id; }).map(function (p) { return p.id; }), 1);
              celebrate(); reset(true);
            };
            return;
          }

          host.innerHTML =
            '<div class="eg-panel tint"><div class="row" style="justify-content:space-between">' +
              '<div style="display:flex;align-items:center;gap:9px">' +
                '<span class="av" style="background:' + a.col + ';width:42px;height:42px;font-size:21px">' + a.av + '</span>' +
                '<span><span style="font-size:11px;font-weight:800;color:var(--muted);display:block">' + (mode === 'no_laugh' ? 'مواجهة الضحك بين:' : 'صاحب الدور الآن:') + '</span>' +
                '<b style="font-family:var(--font-ui);font-size:14.5px">' + (mode === 'no_laugh' ? esc(a.name) + ' ⚡ ' + esc(b2.name) : esc(a.name)) + '</b></span>' +
              '</div>' +
              '<div class="row">' +
                '<span class="timer-badge tabnum' + (st.left <= (mode === 'five_seconds' ? 2 : 10) ? ' danger' : '') + '" id="tBadge">⏱️ ' + (mode === 'five_seconds' ? st.left.toFixed(1) : st.left) + ' ث</span>' +
                (st.run
                  ? '<button class="btn btn-gold" style="padding:9px 14px" id="tPause">⏸ إيقاف</button>'
                  : '<button class="btn btn-teal" style="padding:9px 14px" id="tStart">▶ ابدأ الوقت</button>') +
              '</div></div></div>' +

            '<div class="eg-panel eg-center">' + cardHTML() + '</div>' +

            '<div class="eg-panel tint">' +
              ((mode === 'charades' || mode === 'sing_word')
                ? '<div style="font-size:12px;font-weight:800;color:var(--muted);text-align:center">' +
                    (mode === 'charades' ? 'من حزر تمثيل «' + esc(a.name) + '»؟ (يكسب كلاهما +1 نقطة):' : 'اضغط على أسرع لاعب غنّى الكلمة بشكل صحيح (+1 نقطة):') + '</div>' +
                  '<div class="row" style="margin-top:10px">' + ps.filter(function (p) { return mode === 'sing_word' || p.id !== a.id; }).map(function (p) {
                    return '<button class="btn btn-soft" data-win="' + p.id + '">' + p.av + ' ' + esc(p.name) + '</button>';
                  }).join('') + '</div>'
                : mode === 'no_laugh'
                ? '<div class="row">' +
                    '<button class="btn btn-teal" data-duel="' + a.id + '">😐 صمد «' + esc(a.name) + '» وفاز! (+1)</button>' +
                    '<button class="btn btn-dark" data-duel="' + b2.id + '">😐 صمد «' + esc(b2.name) + '» وفاز! (+1)</button>' +
                  '</div>'

                    '<button class="btn btn-teal" id="tcOk">✅ نجح «' + esc(a.name) + '»! (+1 نقطة)</button>' +

              (st.done ? '<div style="text-align:center;font-size:12px;font-weight:800;color:var(--coral);margin-top:10px">⏰ انتهى الوقت! اختر النتيجة أو انتقل للبطاقة التالية.</div>' : '') +
              '<div style="text-align:center;margin-top:12px"><button class="btn btn-soft" style="padding:7px 14px;font-size:12px" id="tcSkip">🔄 بطاقة جديدة والدور التالي</button></div>' +
            '</div>';

          var ts = $('#tStart', host); if (ts) ts.onclick = startTimer;
          var tp = $('#tPause', host); if (tp) tp.onclick = function () { clearTimers(); st.run = false; draw(); };
          var cs = $('#cShow', host); if (cs) cs.onclick = function () { st.open = true; sPop(); draw(); };
          var ch = $('#cHide', host); if (ch) ch.onclick = function () { st.open = false; sPop(); draw(); };
          $$('[data-win]', host).forEach(function (b) {
            b.onclick = function () {
              var ids = mode === 'charades' ? [a.id, b.dataset.win] : [b.dataset.win];
              award(ids, 1); celebrate(); reset(true);

          });
          $$('[data-duel]', host).forEach(function (b) { b.onclick = function () { award([b.dataset.duel], 1); celebrate(); reset(true); }; });
          var ok = $('#tcOk', host); if (ok) ok.onclick = function () { award([a.id], 1); celebrate(); reset(true); };
          var fo = $('#tcFoul', host); if (fo) fo.onclick = function () { sBuzz(); reset(false); };
          $('#tcSkip', host).onclick = function () { sPop(); reset(true); };
        }

        draw();
        // cleanup timers when modal closes
        var mo = new MutationObserver(function () { if (!document.body.contains(host)) { clearTimers(); mo.disconnect(); } });
        mo.observe(document.body, { childList: true, subtree: true });
      }
      ['charades','five_seconds','taboo','heads_up','word_bomb','no_laugh','sing_word'].forEach(function (m) {
        ENG[m] = function (host) { timerCardEngine(host, m); };
      });

      /* ==================== 7) DRAW & GUESS ==================== */
      ENG.draw_guess = function (host) {
        var COLORS = ['#1b1a17', '#c4442a', '#0e7566', '#b8860b', '#2b4fb8', '#8e2c5c'];
        var st = { ai:0, wi:rnd(DRAW_WORDS.length), peek:false, color:'#1b1a17', size:5, eraser:false, left:60, run:false };
        var drawing = false, timer = null, cv = null, cx2 = null;

        function draw() {
          var ps = S.players, a = ps[st.ai % ps.length], w = DRAW_WORDS[st.wi % DRAW_WORDS.length];
          host.innerHTML =
            '<div class="eg-panel tint"><div class="row" style="justify-content:space-between">' +
              '<div style="display:flex;align-items:center;gap:9px"><span class="av" style="background:' + a.col + ';width:42px;height:42px;font-size:21px">' + a.av + '</span>' +
              '<span><span style="font-size:11px;font-weight:800;color:var(--muted);display:block">الرسام في هذه الجولة:</span>' +
              '<b style="font-family:var(--font-ui);font-size:14.5px">' + esc(a.name) + '</b></span></div>' +
              '<div class="row">' +
                '<span class="timer-badge tabnum' + (st.left <= 10 ? ' danger' : '') + '">⏱️ ' + st.left + ' ث</span>' +
                '<button class="btn ' + (st.peek ? 'btn-dark' : 'btn-berry') + '" style="padding:9px 14px" id="dPeek">' + (st.peek ? '🙈 إخفاء الكلمة' : '👁 اكشف الكلمة للرسام') + '</button>' +
              '</div></div></div>' +

            (st.peek
              ? '<div class="eg-hero" style="background:linear-gradient(160deg,#fff6df,#ffeccd);border-color:var(--gold);padding:16px">' +
                  '<span class="eg-label" style="background:#a9720a;color:#fff">🤫 سري للرسام «' + esc(a.name) + '» فقط — ارسم:</span>' +
                  '<div class="kw" style="color:var(--ink-text);margin-top:8px">' + esc(w) + '</div></div>'
              : '') +

            '<div class="eg-panel"><div class="row" style="justify-content:space-between">' +
              '<div class="swatches">' + COLORS.map(function (c) {
                return '<button class="sw' + (!st.eraser && st.color === c ? ' on' : '') + '" data-col="' + c + '" style="background:' + c + '"></button>';
              }).join('') + '</div>' +
              '<div class="tools">' +
                '<button class="tool" id="dSize">✏️ سمك: ' + (st.size === 5 ? 'عادي' : 'عريض') + '</button>' +
                '<button class="tool' + (st.eraser ? ' on' : '') + '" id="dErase">🧽 ممحاة</button>' +
                '<button class="tool danger" id="dClear">🗑️ مسح</button>' +
              '</div></div></div>' +

            '<div class="board-wrap"><canvas id="drawCanvas" width="760" height="380"></canvas></div>' +

            '<div class="eg-panel tint eg-center">' +
              '<div style="font-size:12px;font-weight:800;color:var(--muted)">من حزر الرسمة أولاً؟ (يحصل هو والرسام «' + esc(a.name) + '» على +1 نقطة):</div>' +
              '<div class="row" style="margin-top:10px">' +
                ps.filter(function (p) { return p.id !== a.id; }).map(function (p) {
                  return '<button class="btn btn-soft" data-guessed="' + p.id + '">' + p.av + ' ' + esc(p.name) + '</button>';
                }).join('') +
                '<button class="btn btn-dark" id="dNext">🔄 تخطي للرسام التالي</button>' +
              '</div></div>';

          $('#dPeek', host).onclick = function () { st.peek = !st.peek; sPop(); draw(); };
          $$('[data-col]', host).forEach(function (b) { b.onclick = function () { st.color = b.dataset.col; st.eraser = false; draw(); }; });
          $('#dSize', host).onclick = function () { st.size = st.size === 5 ? 11 : 5; draw(); };
          $('#dErase', host).onclick = function () { st.eraser = !st.eraser; draw(); };
          $('#dClear', host).onclick = function () { clearBoard(); };
          $$('[data-guessed]', host).forEach(function (b) {
            b.onclick = function () { award([a.id, b.dataset.guessed], 1); celebrate(); nextTurn(); };
          });
          $('#dNext', host).onclick = nextTurn;

          var newCanvas = $('#drawCanvas', host);
          // Keep the same canvas node when changing tools or hiding the prompt.
          if (cv) { drawing = false; newCanvas.parentNode.replaceChild(cv, newCanvas); return; }
          cv = newCanvas;
          try { cx2 = cv && cv.getContext ? cv.getContext('2d') : null; } catch (e) { cx2 = null; }
          clearBoard();
          cv.addEventListener('pointerdown', down);
          cv.addEventListener('pointermove', move);
          cv.addEventListener('pointerup', up);
          cv.addEventListener('pointerleave', up);
          cv.addEventListener('pointercancel', up);
        }

        function coords(e) {
          var r = cv.getBoundingClientRect();
          return { x: (e.clientX - r.left) * (cv.width / r.width), y: (e.clientY - r.top) * (cv.height / r.height) };
        }
        function down(e) {
          if (!cx2 || !cv) return;
          if (cv.setPointerCapture) { try { cv.setPointerCapture(e.pointerId); } catch (err) {} }
          drawing = true;
          if (!st.run && st.left === 60) {
            st.run = true;
            timer = setInterval(function () {
              st.left = Math.max(0, st.left - 1);
              var b = $('.timer-badge', host);
              if (b) { b.textContent = '⏱️ ' + st.left + ' ث'; b.className = 'timer-badge tabnum' + (st.left <= 10 ? ' danger' : ''); }
              if (st.left <= 5 && st.left > 0) sTick(780);
              if (st.left <= 0) { clearInterval(timer); st.run = false; sBuzz(); }
            }, 1000);
          }
          var p = coords(e); cx2.beginPath(); cx2.moveTo(p.x, p.y);
        }
        function move(e) {
          if (!drawing || !cx2 || !cv) return;
          var p = coords(e);
          cx2.lineCap = 'round'; cx2.lineJoin = 'round';
          cx2.strokeStyle = st.eraser ? '#ffffff' : st.color;
          cx2.lineWidth = st.eraser ? 26 : st.size;
          cx2.lineTo(p.x, p.y); cx2.stroke();
        }
        function up() { drawing = false; }
        function clearBoard() {
          if (!cx2 || !cv) return;
          cx2.fillStyle = '#ffffff'; cx2.fillRect(0, 0, cv.width, cv.height);
        }
        function nextTurn() {
          if (timer) clearInterval(timer);
          st.ai = (st.ai + 1) % S.players.length; st.wi += 1 + rnd(3);
          st.peek = false; st.left = 60; st.run = false; st.eraser = false;
          clearBoard(); sPop(); draw();
        }
        draw();
        var mo = new MutationObserver(function () {
          if (!document.body.contains(host)) { if (timer) clearInterval(timer); mo.disconnect(); }
        });
        mo.observe(document.body, { childList: true, subtree: true });
      };

          $$('[data-a]', host).forEach(function (b) { b.onclick = function () { st.votes[b.dataset.a] = 'A'; sTick(700); draw(); }; });
          $$('[data-b]', host).forEach(function (b) { b.onclick = function () { st.votes[b.dataset.b] = 'B'; sTick(700); draw(); }; });

        function draw() {

      /* ==================== 12) TELEPATHY 1-100 ==================== */
      ENG.telepathy = function (host) {
        var st = { nums:{}, i:0, peek:false, ph:'deal', order:[] };
        function init() {
          var used = {}, m = {};

          var ps = S.players;

              '<div class="eg-panel eg-center" style="max-width:460px;margin:0 auto">' +
                '<div style="font-size:44px">' + p.av + '</div>' +

                (!st.peek
                  ? '<button class="btn btn-berry" style="width:100%;padding:15px;margin-top:10px" id="tpPeek">🔮 اكشف رقمي السري (من 1 إلى 100)</button>'

              if (st.i + 1 < ps.length) { st.i++; draw(); } else { st.ph = 'order'; sPop(); draw(); }

              '<div class="eg-hero" style="background:linear-gradient(160deg,#fff6df,#ffeccd);border-color:var(--gold)">' +
                '<h3 style="color:#a9720a;font-size:22px">صفوا أرقامكم بتشبيه (سرعة وسيلة نقل، حرارة جو، حجم حيوان...)</h3>' +
                '<p>ممنوع نطق الأرقام! ثم اضغطوا على الأسماء بالترتيب من الأصغر للأكبر.</p></div>' +
              '<div class="row">' + ps.map(function (p) {
                var idx = st.order.indexOf(p.id);
                return '<button class="btn ' + (idx >= 0 ? 'btn-berry' : 'btn-soft') + '" data-ord="' + p.id + '">' +
                  (idx >= 0 ? '<span class="eg-label tabnum" style="background:#fff;color:#8e2c5c;padding:1px 8px">' + (idx + 1) + '</span> ' : '') + p.av + ' ' + esc(p.name) + '</button>';
              }).join('') + '</div>' +
              '<button class="btn btn-primary" style="width:100%;padding:15px;font-size:16px" id="tpCheck" ' + (st.order.length === ps.length ? '' : 'disabled') + '>🔮 تحقق من التخاطر العائلي!</button>';
            $$('[data-ord]', host).forEach(function (b) {
              b.onclick = function () {
                var id = b.dataset.ord, k = st.order.indexOf(id);

            $('#tpCheck', host).onclick = function () {

          }

          host.innerHTML =
            '<div class="result-box" style="background:' + (st.ok ? '#e6f6f1' : '#ffece6') + ';border-color:' + (st.ok ? '#0e7566' : '#c4442a') + '">' +

            '<button class="btn btn-dark" style="width:100%;padding:15px" id="tpAgain">🔄 جولة تخاطر جديدة</button>';

      /* ==================== REAL REVERSED-SOUND GAMES ==================== */

      function makeSceneBuffer(kind) {

        else if (kind === 'knock') { [0,.3,.62].forEach(function (offset) { toneAt(offset, .16, 110, 64, .8, 'sine'); noiseAt(offset, .07, .27, 30); }); }

      /* ==================== 100 MORE GAMES (B): shared helpers + engines ==================== */
      function onGone(host, fn) {

        else if (it.expr) h += '<h3 class="spotlight-question math' + (String(it.expr).length > 22 ? ' crowd' : '') + '" dir="' + (it.dir || 'ltr') + '">' + esc(it.expr) + '</h3>' + (it.q ? '<p class="lead-line">' + esc(it.q) + '</p>' : '');
        else h += '<h3 class="spotlight-question' + (String(it.q || '').length > 70 ? ' long' : '') + '" dir="auto">' + esc(it.q || '') + '</h3>';

      /* ---------- A) multiple choice driven by a level-aware generator ---------- */
      ENG.gen_mc = function (host) {
        host.classList.add('challenge-stage');
        var cfg = S.game.cfg, st = { turn:0, round:0, item:null, answer:null, removed:[], hint:false, left:0 }, timer = null, deadline = 0, recent = [], alive = true;
        function stop() { if (timer) clearInterval(timer); timer = null; }
        onGone(host, function () { alive = false; stop(); });
        function makeItem() {
          var it, key, tries = 0;
          do {
            it = cfg.gen(diffNow());
            key = (it.expr || it.html || '') + '|' + (it.q || '') + '|' + (it.lines ? it.lines.join(';') : '') + '|' + (it.f || '') + (it.n || '') + (it.seq || '') + (it.target || '');
            tries++;
          } while (recent.indexOf(key) >= 0 && tries < 10);
          recent.push(key); if (recent.length > 10) recent.shift();
          return it;
        }
        function nextQ(rotate) {
          stop(); st.item = makeItem(); host.__item = st.item; if (rotate) st.turn++; st.round++; st.answer = null; st.removed = []; st.hint = false;
          var t = qTime(cfg.time); st.left = t; draw();
          if (t) { deadline = Date.now() + t * 1000; timer = setInterval(tick, 200); }
          if (st.item.play) setTimeout(function () { if (alive && st.item && st.answer === null) st.item.play(); }, 450);
        }
        function tick() {
          if (!alive) return stop();
          st.left = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
          var b = $('#mcTime', host); if (b) { b.textContent = '⏱ ' + st.left + ' ث'; b.className = 'timer-badge tabnum' + (st.left <= 5 ? ' danger' : ''); }
          if (!st.left) { stop(); if (st.answer === null) { st.answer = '__t'; sBuzz(); draw(); } }
        }
        function draw() {
          var p = curPlayer(st.turn), it = st.item, done = st.answer !== null, ok = done && st.answer === it.a, label = cfg.label || S.game.title;
          var canHint = hintsAllowed() && !done && !st.hint && it.opts.length >= 4;
          host.innerHTML = '<div class="round-bar"><span class="round-chip">' + esc(label) + '</span>' +
            (st.left ? '<span class="timer-badge tabnum' + (st.left <= 5 ? ' danger' : '') + '" id="mcTime">⏱ ' + st.left + ' ث</span>' : '') + roundPlayer(p) + '</div>' +
            scene2(label, it) +
            (it.play || it.previews ? '<div class="challenge-actions">' + (it.play ? '<button class="btn btn-sun" id="mcPlay" data-tv-start type="button">' + icon('sound') + ' سمع</button>' : '') +
              (it.previews || []).map(function (pv, i) { return '<button class="btn btn-soft" data-preview="' + i + '" type="button">▶ ' + esc(pv.label) + '</button>'; }).join('') + '</div>' : '') +
            '<div class="eg-grid c2">' + it.opts.map(function (o, i) {
              var gone = st.removed.indexOf(o) >= 0, cls = done ? (o === it.a ? ' correct' : o === st.answer ? ' wrong' : ' dim') : gone ? ' dim' : '';
              return '<button class="opt' + cls + '" dir="auto" data-o="' + i + '"' + (i === 0 && !done && !it.play ? ' data-tv-start' : '') + ((done || gone) ? ' disabled' : '') + '>' + esc(o) + '</button>';
            }).join('') + '</div>' +
            (done ? resultBox(ok, ok ? '✓ صحيح! +1' : (st.answer === '__t' ? '⏰ سالا الوقت — ' : '') + 'الجواب: ' + it.a, it.why) : '') +
            '<div class="challenge-actions">' + (canHint ? '<button class="btn btn-soft" id="mcHint" type="button">💡 حيّد جوج اختيارات</button>' : '') +
            '<button class="btn ' + (done ? 'btn-sun' : 'btn-soft') + '" id="mcNext" type="button"' + (done ? ' data-tv-start' : '') + '>' + (done ? 'السؤال التالي ←' : 'تخطّي') + '</button></div>';
          var play = $('#mcPlay', host); if (play) play.onclick = function () { it.play(); };
          $$('[data-preview]', host).forEach(function (b) { b.onclick = function () { it.previews[Number(b.dataset.preview)].play(); }; });
          $$('[data-o]', host).forEach(function (b) { b.onclick = function () {
            if (st.answer !== null) return;
            stop(); st.answer = it.opts[Number(b.dataset.o)];
            if (st.answer === it.a) { award([p.id], 1); celebrate(); } else sBuzz();
            draw();
          }; });
          var hint = $('#mcHint', host);
          if (hint) hint.onclick = function () {
            st.hint = true; S.levelHint = true;
            st.removed = shuffle(it.opts.filter(function (o) { return o !== it.a; })).slice(0, 2); sPop(); draw();
          };
          $('#mcNext', host).onclick = function () { sPop(); nextQ(true); };
        }
        nextQ(false);
      };

      /* ---------- B) Simon-style sequence memory ---------- */
      var SIMON_SETS = {
        colors:[{t:'●',c:'#e5534b',n:'أحمر'},{t:'●',c:'#4c8dff',n:'أزرق'},{t:'●',c:'#3fbf7f',n:'أخضر'},{t:'●',c:'#f2c14e',n:'أصفر'}],
        emoji:['🐱','🐶','🐸','🦊','🐼','🐯'].map(function (t) { return { t:t, n:t }; }),
        numbers:'123456789'.split('').map(function (t) { return { t:t, n:t }; }),
        arrows:[{t:'←',n:'يسار'},{t:'↑',n:'فوق'},{t:'↓',n:'تحت'},{t:'→',n:'يمين'}],
        letters:['ب','ت','س','م','ن','ه'].map(function (t) { return { t:t, n:t }; }),
        tones:[{t:'♪ 1',c:'#e5534b',f:262,n:'نغمة 1'},{t:'♪ 2',c:'#4c8dff',f:330,n:'نغمة 2'},{t:'♪ 3',c:'#3fbf7f',f:392,n:'نغمة 3'},{t:'♪ 4',c:'#f2c14e',f:523,n:'نغمة 4'}]
      };
      ENG.gen_simon = function (host) {
        host.classList.add('challenge-stage');
        var kind = S.game.cfg.kind, set = SIMON_SETS[kind], d = diffNow();
        var st = { turn:0, seq:[], pos:0, phase:'idle', len:lerpI(2, 9, d), played:0 }, alive = true, timers = []; host.__st = st;
        function clearT() { timers.forEach(clearTimeout); timers = []; }
        function later(fn, ms) { timers.push(setTimeout(function () { if (alive) fn(); }, ms)); }
        onGone(host, function () { alive = false; clearT(); });
        function newSeq() { var n = Math.min(14, st.len + st.played); st.seq = []; for (var i = 0; i < n; i++) st.seq.push(rnd(set.length)); st.pos = 0; }
        function flash(i, ms) {
          var b = $('[data-pad="' + i + '"]', host); if (!b) return;
          b.classList.add('lit');
          if (set[i].f) ptone(set[i].f, ms, 'sine'); else sTick(480 + i * 70);
          later(function () { b.classList.remove('lit'); }, ms);
        }
        function play() {
          clearT(); st.phase = 'show'; st.pos = 0; draw();
          var gap = lerpI(720, 340, d), on = Math.round(gap * .62);
          st.seq.forEach(function (idx, k) { later(function () { flash(idx, on); }, 550 + k * gap); });
          later(function () { st.phase = 'input'; draw(); focusIn(host, '[data-pad]'); }, 550 + st.seq.length * gap + 150);
        }
        function press(i) {
          if (st.phase !== 'input') return;

          st.pos++;
          var prog = $('#simonProg', host); if (prog) prog.textContent = '  ' + st.pos + ' / ' + st.seq.length;
          if (st.pos >= st.seq.length) { var p = curPlayer(st.turn); st.turn++; st.played++; st.phase = 'win'; award([p.id], 1); celebrate(); draw(); focusIn(host, '#simonGo'); }
        }
        function draw() {
          var p = curPlayer(st.turn), len = st.seq.length || Math.min(14, st.len + st.played);
          var msg = { idle:'اضغط «ابدأ» وركّز فالترتيب', show:'ركّز… الترتيب كيتعرض', input:'دابا نتا: عاود نفس الترتيب', fail:'✗ غلطتي! جرّب ترتيب جديد', win:'✓ برافو! ترتيب صحيح' }[st.phase];
          host.innerHTML = '<div class="round-bar"><span class="round-chip">طول الترتيب: ' + len + '</span>' + roundPlayer(p) + '</div>' +
            '<div class="game-hint" id="simonMsg" role="status">' + msg + '<b id="simonProg"></b></div>' +
            '<div class="pad-grid" style="--cols:' + (set.length === 9 || set.length === 6 ? 3 : 2) + '">' + set.map(function (s, i) {
              return '<button type="button" class="pad" data-pad="' + i + '"' + (s.c ? ' style="background:' + s.c + ';color:#241532"' : '') + ' aria-label="' + esc(s.n || s.t) + '"' + (st.phase === 'input' ? '' : ' disabled') + '>' + esc(s.t) + '</button>';
            }).join('') + '</div>' +
            '<div class="challenge-actions">' + (st.phase === 'idle' || st.phase === 'fail' || st.phase === 'win' ? '<button class="btn btn-sun" id="simonGo" data-tv-start type="button">' + (st.phase === 'idle' ? 'ابدأ' : 'ترتيب جديد ←') + '</button>' : '') +
            (st.phase === 'input' && hintsAllowed() ? '<button class="btn btn-soft" id="simonReplay" type="button">🔁 عاود العرض</button>' : '') + '</div>';
          $$('[data-pad]', host).forEach(function (b) { b.onclick = function () { press(Number(b.dataset.pad)); }; });
          var go = $('#simonGo', host); if (go) go.onclick = function () { newSeq(); play(); };
          var rp = $('#simonReplay', host); if (rp) rp.onclick = function () { S.levelHint = true; play(); };
        }

      };

      /* ---------- C) grid memory: flash pattern / ordered path ---------- */
      ENG.gen_grid = function (host) {
        host.classList.add('challenge-stage');
        var kind = S.game.cfg.kind, d = diffNow(), n = d < .3 ? 3 : d < .6 ? 4 : d < .85 ? 5 : 6, total = n * n;
        var st = { turn:0, phase:'idle', target:[], picked:[], hits:0 }, alive = true, timers = []; host.__st = st; host.__n = n;
        function clearT() { timers.forEach(clearTimeout); timers = []; }
        function later(fn, ms) { timers.push(setTimeout(function () { if (alive) fn(); }, ms)); }
        onGone(host, function () { alive = false; clearT(); });
        function setup() {
          var k = kind === 'flash' ? Math.min(Math.floor(total * .5), lerpI(3, 13, d)) : Math.min(total, lerpI(3, 9, d));
          st.target = shuffle(range(0, total - 1)).slice(0, k); st.picked = []; st.hits = 0;
        }
        function lit(i, on) { var b = $('[data-cell="' + i + '"]', host); if (b) b.classList.toggle('lit', on); }
        function setMsg(t, cls) { var m = $('#gridMsg', host); if (m) { m.className = cls || 'game-hint'; m.innerHTML = t; } }
        function setActions(h) { var a = $('#gridActions', host); if (a) { a.innerHTML = h; var b = $('#gridGo', host); if (b) b.onclick = start; } }
        function freeze() { $$('[data-cell]', host).forEach(function (b) { b.disabled = true; }); }
        function start() {
          clearT(); setup(); st.phase = 'show'; draw();
          if (kind === 'flash') {
            st.target.forEach(function (i) { lit(i, true); });
            later(function () { st.target.forEach(function (i) { lit(i, false); }); ready(); }, lerpI(1900, 850, d));
          } else {
            var gap = lerpI(700, 380, d);
            st.target.forEach(function (i, k) {
              later(function () { lit(i, true); sTick(500 + k * 25); }, 500 + k * gap);
              later(function () { lit(i, false); }, 500 + k * gap + Math.round(gap * .6));
            });
            later(ready, 500 + st.target.length * gap + 100);
          }
        }
        function ready() { st.phase = 'input'; $$('[data-cell]', host).forEach(function (b) { b.disabled = false; }); setMsg('دابا نتا: ' + (kind === 'flash' ? 'ضغط على الخانات اللي ضاوات' : 'ضغط على الخانات بنفس الترتيب') + '<b id="gridProg"></b>'); focusIn(host, '[data-cell]'); }
        function end(ok, i) {
          st.phase = ok ? 'win' : 'fail'; freeze();
          if (!ok) {
            sBuzz(); var bad = $('[data-cell="' + i + '"]', host); if (bad) bad.classList.add('bad');
            st.target.forEach(function (t) { var c = $('[data-cell="' + t + '"]', host); if (c && !c.classList.contains('hit')) c.classList.add('reveal'); });
            setMsg('✗ غلطتي — الخانات الصحيحة ظهرو', 'challenge-answer miss');
          } else { var p = curPlayer(st.turn); st.turn++; award([p.id], 1); celebrate(); setMsg('✓ برافو! +1', 'challenge-answer'); }
          setActions('<button class="btn btn-sun" id="gridGo" data-tv-start type="button">جولة جديدة ←</button>'); focusIn(host, '#gridGo');
        }
        function prog() { var g = $('#gridProg', host); if (g) g.textContent = '  ' + (kind === 'flash' ? st.picked.length : st.hits) + ' / ' + st.target.length; }
        function tap(i) {
          if (st.phase !== 'input') return;
          var b = $('[data-cell="' + i + '"]', host);
          if (kind === 'flash') {
            if (st.target.indexOf(i) < 0) return end(false, i);
            if (st.picked.indexOf(i) >= 0) return;
            st.picked.push(i); b.classList.add('hit'); sTick(700); prog();
            if (st.picked.length === st.target.length) end(true, i);
          } else {
            if (i !== st.target[st.hits]) return end(false, i);
            st.hits++; b.classList.add('hit'); sTick(700 + st.hits * 20); prog();
